services:
  - type: web
    name: examforge-ai
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: examforge-ai-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_MODE
        value: cloud
      - key: APP_NAME
        value: ExamForge AI
      - key: APP_VERSION
        value: 0.6.0
      - key: DATABASE_URL
        value: sqlite:////data/examforge_workspace.db
      - key: STORAGE_DIR
        value: /data
      - key: ENABLE_PYTHON_TOOL
        value: "false"
      - key: ENABLE_RAPIDOCR
        value: "true"
      - key: ENABLE_TESSERACT
        value: "false"
