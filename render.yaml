services:
  - type: web
    name: campus-ai-workspace
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: campus-workspace-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_MODE
        value: cloud
      - key: APP_NAME
        value: Campus AI Workspace
      - key: APP_VERSION
        value: 0.5.1
      - key: DATABASE_URL
        value: sqlite:////data/workspace.db
      - key: STORAGE_DIR
        value: /data
      - key: ENABLE_PYTHON_TOOL
        value: "false"
      - key: ENABLE_RAPIDOCR
        value: "true"
      - key: ENABLE_TESSERACT
        value: "false"
