services:
  campusforge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/data/uploads
      - ./backend/outputs:/data/outputs
      - ./backend/cache:/data/cache
    environment:
      APP_MODE: cloud
      APP_NAME: CampusForge
      APP_VERSION: 0.5.0
      STORAGE_DIR: /data
      UPLOAD_DIR: uploads
      OUTPUT_DIR: outputs
      OCR_CACHE_DIR: cache/ocr
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://127.0.0.1:8000"]'
