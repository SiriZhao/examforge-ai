services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - examforge_workspace:/data
    environment:
      APP_MODE: cloud
      APP_NAME: RecallForge AI
      APP_VERSION: 0.6.0
      DATABASE_URL: sqlite:////data/examforge_workspace.db
      STORAGE_DIR: /data
      UPLOAD_DIR: uploads
      OUTPUT_DIR: outputs
      OCR_CACHE_DIR: cache/ocr
      CORS_ORIGINS: '["http://localhost:8000","http://127.0.0.1:8000"]'
      ENABLE_PYTHON_TOOL: "false"

volumes:
  examforge_workspace:
